---
name: Build and tests

on:
  push:
    branches: [main]
  pull_request: ~
  workflow_dispatch:
    inputs:
      web_ref:
        description: Branch, tag or commit of echora-web built into the production image
        default: main

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      production: ${{ steps.filter.outputs.production }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "src/**",
                  "config/**",
                  "migrations/**",
                  "public/**",
                  "templates/**",
                  "bin/**",
                  "composer.json",
                  "composer.lock",
                  "symfony.lock",
                  "Dockerfile",
                  "frankenphp/**",
                  ".dockerignore",
                  ".env",
                  ".env.dev",
                  ".env.test",
                  "compose.yaml",
                  ".github/workflows/ci.yaml",
                  "tests/**",
                  "compose.override.yaml",
                  ".php-cs-fixer.dist.php",
                  "phpstan.dist.neon",
                  "phpunit.dist.xml"
                ],
                "exclude": [
                  "tests/**.md"
                ]
              },
              "production": {
                "include": [
                  "src/**",
                  "config/**",
                  "migrations/**",
                  "public/**",
                  "templates/**",
                  "bin/**",
                  "composer.json",
                  "composer.lock",
                  "symfony.lock",
                  "Dockerfile",
                  "frankenphp/**",
                  ".dockerignore",
                  ".env",
                  ".env.dev",
                  ".env.test",
                  "compose.yaml",
                  ".github/workflows/ci.yaml",
                  "compose.prod.yaml",
                  "prod.env.example",
                  "scripts/smoke-test-prod.sh",
                  "tests/Fixtures/**"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  tests:
    needs: [changes]
    if: needs.changes.outputs.checks == 'true'
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost

      - name: Check coding style
        run: docker compose exec -T php composer cs

      # PHPStan's Symfony extension reads the container dumped by the dev cache.
      - name: Warm up the dev cache
        run: docker compose exec -T php bin/console cache:warmup

      - name: Run PHPStan
        run: docker compose exec -T php composer phpstan

      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create

      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Run PHPUnit
        run: docker compose exec -T php composer test

      - name: Validate the Doctrine schema
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  # The production image: API and web client (echora-web, checked out next to this repository as compose.prod.yaml
  # expects), served by Caddy on one origin. Built and started like on a server, then checked from the outside by
  # scripts/smoke-test-prod.sh.
  production:
    needs: [changes]
    if: needs.changes.outputs.production == 'true'
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      COMPOSE_ENV_FILES: prod.env
    defaults:
      run:
        working-directory: Echora
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: Echora
          persist-credentials: false

      - name: Checkout the web client
        uses: actions/checkout@v7
        with:
          repository: Evilchuck666/echora-web
          ref: ${{ inputs.web_ref || 'main' }}
          path: echora-web
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Throwaway secrets; the test library; no TheAudioDB lookups.
      - name: Write prod.env
        run: |
          cat > prod.env <<EOF
          MUSIC_DIR=./tests/Fixtures/music
          SERVER_NAME=localhost
          APP_SECRET=$(openssl rand -hex 32)
          CADDY_MERCURE_JWT_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_PASSPHRASE=$(openssl rand -hex 32)
          THEAUDIODB_API_KEY=
          EOF

      - name: Build the production image
        run: docker compose build --pull

      - name: Start services
        run: docker compose up --wait --no-build

      # The command asks for the password in a terminal: give it one. Its username, "smoke", comes from the email. An
      # administrator, so that the smoke test runs a library scan through the API (the library worker).
      - name: Create an account
        run: printf 'smoke-test-password\nsmoke-test-password\n' | script -qec "docker compose exec php bin/console app:user:create smoke@example.com --admin" /dev/null

      - name: Scan the test library
        run: docker compose exec -T php bin/console app:library:scan --offline

      - name: Smoke test
        env:
          SMOKE_INSECURE: 1
        run: scripts/smoke-test-prod.sh https://localhost smoke smoke-test-password

      # pg_dump of the database's version, with its libraries, in the production image, writing to the backups volume.
      - name: Back the database up
        run: |
          docker compose exec -T php bin/console app:database:backup
          docker compose exec -T php bin/console app:database:restore

      - name: Show the logs
        if: ${{ failure() }}
        run: docker compose logs


  result:
    name: CI result
    if: always()
    needs: [changes, tests, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
