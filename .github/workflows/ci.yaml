---
name: Build and tests

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch:
    inputs:
      web_ref:
        description: Branch, tag or commit of echora-web built into the production image
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost

      - name: Check coding style
        run: docker compose exec -T php composer cs

      # PHPStan's Symfony extension reads the container dumped by the dev cache.
      - name: Warm up the dev cache
        run: docker compose exec -T php bin/console cache:warmup

      - name: Run PHPStan
        run: docker compose exec -T php composer phpstan

      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create

      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Run PHPUnit
        run: docker compose exec -T php composer test

      - name: Validate the Doctrine schema
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  # The production image: API and web client (echora-web, checked out next to this repository as compose.prod.yaml
  # expects), served by Caddy on one origin. Built and started like on a server, then checked from the outside by
  # scripts/smoke-test-prod.sh.
  production:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      COMPOSE_ENV_FILES: prod.env
    defaults:
      run:
        working-directory: Echora
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: Echora
          persist-credentials: false

      - name: Checkout the web client
        uses: actions/checkout@v7
        with:
          repository: Evilchuck666/echora-web
          ref: ${{ inputs.web_ref || 'main' }}
          path: echora-web
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Throwaway secrets; the test library; no TheAudioDB lookups.
      - name: Write prod.env
        run: |
          cat > prod.env <<EOF
          MUSIC_DIR=./tests/Fixtures/music
          SERVER_NAME=localhost
          APP_SECRET=$(openssl rand -hex 32)
          CADDY_MERCURE_JWT_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_PASSPHRASE=$(openssl rand -hex 32)
          THEAUDIODB_API_KEY=
          EOF

      - name: Build the production image
        run: docker compose build --pull

      - name: Start services
        run: docker compose up --wait --no-build

      # The command asks for the password in a terminal: give it one. Its username, "smoke", comes from the email.
      - name: Create an account
        run: printf 'smoke-test-password\nsmoke-test-password\n' | script -qec "docker compose exec php bin/console app:user:create smoke@example.com" /dev/null

      - name: Scan the test library
        run: docker compose exec -T php bin/console app:library:scan --offline

      - name: Smoke test
        env:
          SMOKE_INSECURE: 1
        run: scripts/smoke-test-prod.sh https://localhost smoke smoke-test-password

      - name: Show the logs
        if: ${{ failure() }}
        run: docker compose logs

