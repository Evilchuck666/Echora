security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # App\Repository\UserRepository::loadUserByIdentifier(): the id (what JWTs and refresh tokens hold), the email
        # or the username (what people sign in with).
        app_user_provider:
            entity:
                class: App\Entity\User

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # POST /api/auth {"username": <username or email>, "password": ...} → {"token": ..., "refresh_token": ...}
        # A firewall of its own, so that only password attempts are throttled: in the "api" firewall, every expired JWT
        # or spent refresh token would count as a failed sign-in too (docs/decisions/0014).
        login:
            pattern: ^/api/auth$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_auth
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                # Lexik's handler, except for throttled attempts: 429 with Retry-After.
                failure_handler: App\Security\LoginFailureHandler
            # 5 failed attempts per account and IP address (and 25 per IP address, whatever the account) in 15 minutes;
            # a successful sign-in clears the account's count. Counted in cache.rate_limiter (cache.app).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # Requests without credentials get a 401 JSON response from the JWT authenticator.
            entry_point: jwt
            # Authorization: Bearer <token> on every other request.
            jwt: ~
            # POST /api/token/refresh {"refresh_token": ...} → a new token and refresh token.
            # check_path is the path, not the route name: the bundle documents it in OpenAPI as written.
            # Concurrent refreshes with the same token are serialized by App\Security\RefreshTokenLockListener.
            refresh_jwt:
                check_path: /api/token/refresh
            # POST /api/logout {"refresh_token": ...} → that refresh token is deleted (invalidate_token_on_logout,
            # on by default), so the session it belongs to can't be renewed. Needs no JWT: it may have expired.
            logout:
                path: api_logout

    # Note: Only the *first* matching rule is applied
    access_control:
        # API documentation (Swagger UI, OpenAPI, JSON-LD contexts): describes the API, holds no data.
        - { path: '^/api$', roles: PUBLIC_ACCESS }
        - { path: '^/api/(docs|contexts)(/|\.|$)', roles: PUBLIC_ACCESS }
        - { path: '^/api/(auth|token/refresh|logout)$', roles: PUBLIC_ACCESS }
        # Until the server has an account, whoever comes first creates the administrator (App\ApiResource\Setup).
        - { path: '^/api/setup$', roles: PUBLIC_ACCESS }
        # Checked by LibraryFiles::denyUnlessAuthorized(): a JWT or a signed URL (players and <img> can't send headers).
        - { path: '^/api/tracks/[^/]+/stream(/opus)?$', roles: PUBLIC_ACCESS }
        - { path: '^/api/(albums|artists)/[^/]+/cover$', roles: PUBLIC_ACCESS }
        - { path: '^/api/users/[^/]+/avatar$', methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
