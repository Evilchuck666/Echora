security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # Requests without credentials get a 401 JSON response from the JWT authenticator.
            entry_point: jwt
            # POST /api/auth {"username": ..., "password": ...} → {"token": ..., "refresh_token": ...}
            json_login:
                check_path: api_auth
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Authorization: Bearer <token> on every other request.
            jwt: ~
            # POST /api/token/refresh {"refresh_token": ...} → a new token and refresh token.
            refresh_jwt:
                check_path: api_refresh_token

    # Note: Only the *first* matching rule is applied
    access_control:
        # API documentation (Swagger UI, OpenAPI, JSON-LD contexts): describes the API, holds no data.
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(docs|contexts)(/|\.|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/(auth|token/refresh)$, roles: PUBLIC_ACCESS }
        # Checked by LibraryFiles::denyUnlessAuthorized(): a JWT or a signed URL (players and <img> can't send headers).
        - { path: ^/api/tracks/[^/]+/stream$, roles: PUBLIC_ACCESS }
        - { path: ^/api/albums/[^/]+/cover$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
