api_platform:
    title: Echora API
    description: Self-hosted music streaming service. Browse the library and stream its tracks.
    version: 0.1.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    # "Authorize" button of the documentation: paste "Bearer <token>" from POST /api/auth.
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
