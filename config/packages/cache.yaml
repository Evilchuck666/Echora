framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Refresh token bookkeeping: spent tokens (reuse detection) and the successors kept for the grace
            # period (App\Security\RefreshTokenSuccessors). In PostgreSQL (the cache_items table), not in var/cache:
            # it has to survive restarts and deploys, or a replayed token would no longer be recognised.
            cache.refresh_tokens:
                adapter: cache.adapter.doctrine_dbal

when@test:
    framework:
        cache:
            pools:
                # Throttled attempts in PostgreSQL in tests: kept from one request to the next, and rolled back with the rest
                # after each test (DAMA). The filesystem would keep them between tests and runs, and an array would be
                # emptied before every request.
                cache.rate_limiter:
                    adapter: cache.adapter.doctrine_dbal
