# Lets web clients served from another origin (the React app) call the API.
# Allowed origins: CORS_ALLOW_ORIGIN, a regular expression (.env for development, prod.env in production).
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # Range: clients that fetch() the audio themselves ask for byte ranges.
        allow_headers: ['Content-Type', 'Authorization', 'Range']
        # Readable from JavaScript: pagination links and the headers of partial responses.
        expose_headers: ['Link', 'Content-Range', 'Content-Length', 'Accept-Ranges']
        max_age: 3600
    paths:
        '^/': null
