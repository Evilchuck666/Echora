framework:
    messenger:
        transports:
            # Opus versions converted ahead of time (App\Message\TranscodeTracks, POST /api/transcodes), in the
            # messenger_messages table of PostgreSQL: no other service. Consumed by the workers that docker-entrypoint
            # starts next to FrankenPHP (TRANSCODE_WORKERS of them). PostgreSQL notifies them of new messages.
            transcodes:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: transcodes
                # Converting ahead of time only saves waiting: a failure is logged by the handler, never retried.
                retry_strategy:
                    max_retries: 0

            # Library scans asked for through the API (App\Message\ScanLibrary, POST /api/library/scan): one worker of
            # their own (docker-entrypoint), so that a long scan never holds up the Opus conversions.
            library:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: library
                    # A big library can take more than the default hour: a scan still running is not lost.
                    redeliver_timeout: 86400
                # The scan records its own failure (App\Entity\LibraryScan): never retried.
                retry_strategy:
                    max_retries: 0

        routing:
            App\Message\TranscodeTracks: transcodes
            App\Message\ScanLibrary: library

when@test:
    framework:
        messenger:
            transports:
                # Tests take the messages from the transport and call the handler themselves.
                transcodes: 'in-memory://'
                library: 'in-memory://'
