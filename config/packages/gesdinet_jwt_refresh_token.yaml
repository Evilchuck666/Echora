# Refresh tokens let clients get a new JWT without asking for the password again.
gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    # 30 days, started over on every refresh: a client used at least once a month stays signed in.
    ttl: 2592000
    # Every refresh returns a new refresh token and spends the old one.
    single_use: true
    # Presenting a spent token (likely stolen) revokes every token of its chain.
    reuse_detection:
        enabled: true
        # Persistent (config/packages/cache.yaml). Spent tokens are remembered for the refresh token ttl.
        cache: cache.refresh_tokens
    # A token presented again within the grace period, because the response to its refresh was lost, is taken as
    # its successor instead of revoking the session: App\Security\RefreshTokenGraceListener.
    # Store only a hash, so a copy of the database cannot be used to refresh.
    hash_tokens:
        enabled: true
        accept_stored_in_the_clear: false
    return_expiration: true
    api_platform:
        enabled: true
