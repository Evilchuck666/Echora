_security_logout:
    resource: security.route_loader.logout
    type: service

# Handled by the json_login authenticator of the "login" firewall, and the refresh_jwt authenticator and the logout
# listener of the "api" firewall.
api_auth:
    path: /api/auth
    methods: [POST]

api_refresh_token:
    path: /api/token/refresh
    methods: [POST]

api_logout:
    path: /api/logout
    methods: [POST]
